name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v0.9.6, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Test
        run: npm test
      
      - name: Debug - Check npm version and OIDC
        run: |
          npm --version
          echo "Registry: $(npm config get registry)"
          echo "OIDC available: ${{ github.token != '' }}"
      
      - name: Publish to npm
        run: npm publish --provenance --access public
